[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguardai"
version = "1.0.0"
description = "Phishing email analyzer that explains header, sender, language, and link risks in plain English"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[project.scripts]
phish-guard = "apps.api.app.cli:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["apps*"]
exclude = ["apps.web*"]
